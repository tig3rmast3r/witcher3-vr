name: Feature request
description: Suggest an improvement that is not motion-controller support
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Motion-controller support is not currently planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation would this feature address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behaviour rather than only an implementation detail.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: setup
    attributes:
      label: Relevant VR setup
      description: Include headset and runtime when the request is hardware-specific.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This is not a request for motion-controller support.
          required: true
